add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Z4hpvod68HfXeYOEh6kXMCKVJu7xzB2LPGpPiHofXhk=' $matomo_origin; style-src 'self' $identity_style_hash; img-src 'self' $api_origin; media-src 'self' $api_origin; font-src 'self'; connect-src 'self' $api_origin $glitchtip_origin $matomo_origin; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
