<!doctype html>
<html lang="fr" data-color-scheme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Article · Boilerplate HTML</title>
    <meta
      name="description"
      content="Article du blog de démonstration : titre, date, illustration et texte lus dans l’API, administrés dans son admin."
    />
    <link rel="canonical" href="https://www.example.com/blog/" />
    <meta name="robots" content="noindex" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Boilerplate HTML" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Article · Boilerplate HTML" />
    <meta
      property="og:description"
      content="Article du blog de démonstration : titre, date, illustration et texte lus dans l’API, administrés dans son admin."
    />
    <meta property="og:url" content="https://www.example.com/blog/" />
    <meta property="og:image" content="https://www.example.com/images/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Boilerplate HTML" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Article · Boilerplate HTML" />
    <meta
      name="twitter:description"
      content="Article du blog de démonstration : titre, date, illustration et texte lus dans l’API, administrés dans son admin."
    />
    <meta name="twitter:image" content="https://www.example.com/images/og-image.jpg" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1d4ed8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      document.documentElement.dataset.js = ''
      try {
        if (localStorage.getItem('a11y-mode') === 'enhanced') {
          document.documentElement.dataset.a11yMode = 'enhanced'
        }
        const colorScheme = localStorage.getItem('color-scheme')
        if (colorScheme === 'auto' || colorScheme === 'light' || colorScheme === 'dark') {
          document.documentElement.dataset.colorScheme = colorScheme
        }
      } catch {}
    </script>
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/vendor/boilerplates-ui.css" />
    <script type="module" src="/js/shared/a11yModeToggle.js"></script>
    <script type="module" src="/js/shared/colorSchemeToggle.js"></script>
    <script type="module" src="/js/shared/categoryMenu.js"></script>
    <script type="module" src="/js/modules/cart/ui/cartLink.js"></script>
    <script type="module" src="/js/modules/blog/ui/articlePage.js"></script>
  </head>
  <body>
    <!--# set var="page" value="article" -->
    <!--# include virtual="/partials/header.html" -->
    <main id="main">
      <div class="container page" data-article-page>
        <nav class="bui-breadcrumb" aria-label="Fil d'Ariane" data-testid="layout-breadcrumb">
          <ol class="bui-breadcrumb__list">
            <li class="bui-breadcrumb__item"><a class="bui-link" href="/">Accueil</a></li>
            <li class="bui-breadcrumb__item"><a class="bui-link" href="/blog">Blog</a></li>
            <li class="bui-breadcrumb__item">
              <span class="bui-breadcrumb__current" aria-current="page" data-article-crumb
                >Article</span
              >
            </li>
          </ol>
        </nav>
        <article class="article prose" data-testid="article-page">
          <h1 data-article-title data-testid="article-title">Article</h1>
          <div data-article-state>
            <div class="skeleton-list" role="status" data-testid="article-loading">
              <span class="visually-hidden">Chargement de l'article…</span>
              <span class="bui-skeleton" aria-hidden="true"></span>
              <span class="bui-skeleton" aria-hidden="true"></span>
              <span class="bui-skeleton" aria-hidden="true"></span>
            </div>
          </div>
          <noscript>
            <div class="bui-alert bui-alert--info" data-testid="article-noscript">
              <svg class="bui-icon bui-alert__icon" aria-hidden="true" focusable="false">
                <use href="/icons.svg#info"></use>
              </svg>
              <div class="bui-alert__content">
                <span class="bui-visually-hidden">Information :</span>
                <div class="bui-alert__body">
                  <p>L'article est lu dans l'API par JavaScript. Activez-le pour l'afficher.</p>
                </div>
              </div>
            </div>
          </noscript>
          <div data-article-content hidden>
            <p class="article-date">
              Publié le <time data-article-date datetime="2026-01-01">1 janvier 2026</time>
            </p>
            <picture class="article-media">
              <source
                type="image/avif"
                sizes="(width >= 800px) 760px, calc(100vw - 32px)"
                data-article-avif
              />
              <source
                type="image/webp"
                sizes="(width >= 800px) 760px, calc(100vw - 32px)"
                data-article-webp
              />
              <img
                src="/images/hero-640.webp"
                alt=""
                width="960"
                height="540"
                fetchpriority="high"
                decoding="async"
                data-article-image
              />
            </picture>
            <p class="article-excerpt" data-article-excerpt></p>
            <div data-article-body data-testid="article-body"></div>
            <p class="article-back">
              <a class="bui-link" href="/blog" data-testid="article-back">Tous les articles</a>
            </p>
          </div>
        </article>
        <template id="article-error-template">
          <div class="bui-alert bui-alert--error" role="alert" data-testid="article-error">
            <svg class="bui-icon bui-alert__icon" aria-hidden="true" focusable="false">
              <use href="/icons.svg#circle-alert"></use>
            </svg>
            <div class="bui-alert__content">
              <span class="bui-visually-hidden">Erreur :</span>
              <div class="bui-alert__body"><p data-article-error-message></p></div>
            </div>
            <div class="bui-alert__action">
              <button
                type="button"
                class="bui-button bui-button--outline"
                data-article-retry
                data-testid="article-retry"
              >
                Réessayer
              </button>
            </div>
          </div>
        </template>
        <template id="article-not-found-template">
          <div class="bui-alert bui-alert--info" role="status" data-testid="article-not-found">
            <svg class="bui-icon bui-alert__icon" aria-hidden="true" focusable="false">
              <use href="/icons.svg#info"></use>
            </svg>
            <div class="bui-alert__content">
              <div class="bui-alert__body">
                <p>Cet article n'existe pas ou n'est plus publié.</p>
              </div>
            </div>
          </div>
        </template>
      </div>
    </main>
    <!--# include virtual="/partials/footer.html" -->
  </body>
</html>
