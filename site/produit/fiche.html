<!doctype html>
<html lang="fr" data-color-scheme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Produit · Boilerplate HTML</title>
    <meta
      name="description"
      content="Fiche produit de la jardinerie de démonstration : nom, prix, caractéristiques et photo lus dans l’API."
    />
    <link rel="canonical" href="https://www.example.com/produit/" />
    <meta name="robots" content="noindex" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Boilerplate HTML" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Produit · Boilerplate HTML" />
    <meta
      property="og:description"
      content="Fiche produit de la jardinerie de démonstration : nom, prix, caractéristiques et photo lus dans l’API."
    />
    <meta property="og:url" content="https://www.example.com/produit/" />
    <meta property="og:image" content="https://www.example.com/images/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Boilerplate HTML" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Produit · Boilerplate HTML" />
    <meta
      name="twitter:description"
      content="Fiche produit de la jardinerie de démonstration : nom, prix, caractéristiques et photo lus dans l’API."
    />
    <meta name="twitter:image" content="https://www.example.com/images/og-image.jpg" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1d4ed8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      document.documentElement.dataset.js = ''
      try {
        if (localStorage.getItem('a11y-mode') === 'enhanced') {
          document.documentElement.dataset.a11yMode = 'enhanced'
        }
        const colorScheme = localStorage.getItem('color-scheme')
        if (colorScheme === 'auto' || colorScheme === 'light' || colorScheme === 'dark') {
          document.documentElement.dataset.colorScheme = colorScheme
        }
      } catch {}
    </script>
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/vendor/boilerplates-ui.css" />
    <script type="module" src="/js/shared/a11yModeToggle.js"></script>
    <script type="module" src="/js/shared/colorSchemeToggle.js"></script>
    <script type="module" src="/js/shared/categoryMenu.js"></script>
    <script type="module" src="/js/modules/cart/ui/cartLink.js"></script>
    <script type="module" src="/js/modules/cart/ui/addToCart.js"></script>
    <script type="module" src="/js/modules/catalog/ui/productPage.js"></script>
  </head>
  <body>
    <!--# set var="page" value="produit" -->
    <!--# include virtual="/partials/header.html" -->
    <main id="main">
      <div class="container page" data-product-page>
        <nav class="bui-breadcrumb" aria-label="Fil d'Ariane" data-testid="layout-breadcrumb">
          <ol class="bui-breadcrumb__list" data-product-breadcrumb>
            <li class="bui-breadcrumb__item"><a class="bui-link" href="/">Accueil</a></li>
            <li class="bui-breadcrumb__item">
              <a class="bui-link" href="/catalogue">Catalogue</a>
            </li>
            <li class="bui-breadcrumb__item">
              <span class="bui-breadcrumb__current" aria-current="page" data-product-crumb
                >Produit</span
              >
            </li>
          </ol>
        </nav>
        <article class="product-page" data-testid="product-page">
          <h1 data-product-title data-testid="product-title">Produit</h1>
          <div data-product-state>
            <div class="skeleton-list" role="status" data-testid="product-loading">
              <span class="visually-hidden">Chargement du produit…</span>
              <span class="bui-skeleton" aria-hidden="true"></span>
              <span class="bui-skeleton" aria-hidden="true"></span>
              <span class="bui-skeleton" aria-hidden="true"></span>
            </div>
          </div>
          <noscript>
            <div class="bui-alert bui-alert--info" data-testid="product-noscript">
              <svg class="bui-icon bui-alert__icon" aria-hidden="true" focusable="false">
                <use href="/icons.svg#info"></use>
              </svg>
              <div class="bui-alert__content">
                <span class="bui-visually-hidden">Information :</span>
                <div class="bui-alert__body">
                  <p>Le produit est lu dans l'API par JavaScript. Activez-le pour l'afficher.</p>
                </div>
              </div>
            </div>
          </noscript>
          <div class="product-page-layout" data-product-content hidden>
            <picture class="product-page-media">
              <source
                type="image/avif"
                sizes="(width >= 1440px) 680px, (width >= 768px) 50vw, calc(100vw - 32px)"
                data-product-avif
              />
              <source
                type="image/webp"
                sizes="(width >= 1440px) 680px, (width >= 768px) 50vw, calc(100vw - 32px)"
                data-product-webp
              />
              <img
                src="/images/hero-640.webp"
                alt=""
                width="800"
                height="800"
                fetchpriority="high"
                decoding="async"
                data-product-image
              />
            </picture>
            <div>
              <p class="product-page-price" data-product-price data-testid="product-price"></p>
              <div
                class="product-page-description"
                data-product-description
                data-testid="product-description"
                hidden
              ></div>
              <dl class="product-page-features">
                <dt>Exposition</dt>
                <dd data-product-exposure></dd>
                <dt>Taille</dt>
                <dd data-product-size></dd>
                <dt>Disponibilité</dt>
                <dd data-product-stock>En stock</dd>
              </dl>
              <div class="add-to-cart" data-add-to-cart></div>
              <p>
                <a class="bui-link" href="/catalogue" data-product-category
                  >Voir les autres produits</a
                >
              </p>
            </div>
          </div>
        </article>
        <section
          class="carousel similar-products"
          aria-labelledby="similar-title"
          aria-roledescription="carrousel"
          data-carousel
          data-similar-products
          data-testid="product-similar"
          hidden
        >
          <div class="carousel-header">
            <h2 id="similar-title">Produits similaires</h2>
            <div class="carousel-controls">
              <button
                type="button"
                class="bui-button bui-button--outline"
                aria-controls="similar-track"
                data-carousel-prev
                data-testid="carousel-prev"
                disabled
              >
                <svg
                  class="bui-icon bui-icon--md"
                  aria-hidden="true"
                  focusable="false"
                  width="20"
                  height="20"
                >
                  <use href="/icons.svg#chevron-left"></use>
                </svg>
                Précédent
              </button>
              <button
                type="button"
                class="bui-button bui-button--outline"
                aria-controls="similar-track"
                data-carousel-next
                data-testid="carousel-next"
              >
                Suivant
                <svg
                  class="bui-icon bui-icon--md"
                  aria-hidden="true"
                  focusable="false"
                  width="20"
                  height="20"
                >
                  <use href="/icons.svg#chevron-right"></use>
                </svg>
              </button>
            </div>
          </div>
          <div
            class="carousel-viewport"
            id="similar-track"
            role="group"
            aria-label="Diapositives"
            tabindex="0"
            data-carousel-viewport
            data-testid="carousel-track"
          >
            <div class="carousel-container" data-carousel-slides></div>
          </div>
          <div
            class="carousel-dots"
            role="group"
            aria-label="Choix de la diapositive"
            data-carousel-dots
          ></div>
        </section>
        <template id="carousel-slide-template">
          <div
            class="carousel-slide"
            role="group"
            aria-roledescription="diapositive"
            data-testid="carousel-slide"
          >
            <figure>
              <picture>
                <source
                  type="image/avif"
                  sizes="(width >= 1024px) 33vw, (width >= 640px) 50vw, 100vw"
                  data-slide-avif
                />
                <source
                  type="image/webp"
                  sizes="(width >= 1024px) 33vw, (width >= 640px) 50vw, 100vw"
                  data-slide-webp
                />
                <img
                  src="/images/hero-640.webp"
                  alt=""
                  width="800"
                  height="800"
                  loading="lazy"
                  decoding="async"
                  data-slide-image
                />
              </picture>
              <figcaption>
                <h3>
                  <a
                    class="carousel-link"
                    href="/catalogue"
                    draggable="false"
                    data-testid="carousel-slide-link"
                    data-slide-title
                    >Diapositive</a
                  >
                </h3>
                <p data-slide-text></p>
              </figcaption>
            </figure>
          </div>
        </template>
        <template id="add-to-cart-template">
          <button
            type="button"
            class="bui-button"
            data-add-to-cart-button
            data-testid="add-to-cart"
          >
            Ajouter au panier
          </button>
          <p role="status" data-add-to-cart-status data-testid="add-to-cart-status"></p>
        </template>
        <template id="product-error-template">
          <div class="bui-alert bui-alert--error" role="alert" data-testid="product-error">
            <svg class="bui-icon bui-alert__icon" aria-hidden="true" focusable="false">
              <use href="/icons.svg#circle-alert"></use>
            </svg>
            <div class="bui-alert__content">
              <span class="bui-visually-hidden">Erreur :</span>
              <div class="bui-alert__body"><p data-product-error-message></p></div>
            </div>
            <div class="bui-alert__action">
              <button
                type="button"
                class="bui-button bui-button--outline"
                data-product-retry
                data-testid="product-retry"
              >
                Réessayer
              </button>
            </div>
          </div>
        </template>
        <template id="product-not-found-template">
          <div class="bui-alert bui-alert--info" role="status" data-testid="product-not-found">
            <svg class="bui-icon bui-alert__icon" aria-hidden="true" focusable="false">
              <use href="/icons.svg#info"></use>
            </svg>
            <div class="bui-alert__content">
              <div class="bui-alert__body">
                <p>Ce produit n'existe pas ou n'est plus en vente.</p>
              </div>
            </div>
          </div>
        </template>
      </div>
    </main>
    <!--# include virtual="/partials/footer.html" -->
  </body>
</html>
