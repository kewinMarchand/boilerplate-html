<!doctype html>
<html lang="fr" data-color-scheme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page introuvable · Boilerplate HTML</title>
    <meta
      name="description"
      content="La page demandée n'existe pas ou a été déplacée. Retrouvez l'accueil, le catalogue ou le plan du site."
    />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1d4ed8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      document.documentElement.dataset.js = ''
      try {
        if (localStorage.getItem('a11y-mode') === 'enhanced') {
          document.documentElement.dataset.a11yMode = 'enhanced'
        }
        const colorScheme = localStorage.getItem('color-scheme')
        if (colorScheme === 'auto' || colorScheme === 'light' || colorScheme === 'dark') {
          document.documentElement.dataset.colorScheme = colorScheme
        }
      } catch {}
    </script>
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/vendor/boilerplates-ui.css" />
    <script type="module" src="/js/shared/a11yModeToggle.js"></script>
    <script type="module" src="/js/shared/colorSchemeToggle.js"></script>
    <script type="module" src="/js/shared/categoryMenu.js"></script>
    <script type="module" src="/js/modules/cart/ui/cartLink.js"></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "name": "Accueil",
            "item": "https://www.example.com/"
          },
          {
            "@type": "ListItem",
            "position": 2,
            "name": "Page introuvable",
            "item": "https://www.example.com/404"
          }
        ]
      }
    </script>
  </head>
  <body>
    <!--# set var="page" value="erreur" -->
    <!--# include virtual="/partials/header.html" -->
    <main id="main">
      <div class="container page prose">
        <nav class="bui-breadcrumb" aria-label="Fil d'Ariane" data-testid="layout-breadcrumb">
          <ol class="bui-breadcrumb__list">
            <li class="bui-breadcrumb__item"><a class="bui-link" href="/">Accueil</a></li>
            <li class="bui-breadcrumb__item">
              <span class="bui-breadcrumb__current" aria-current="page">Page introuvable</span>
            </li>
          </ol>
        </nav>
        <h1>Page introuvable</h1>
        <p>La page demandée n'existe pas ou a été déplacée.</p>
        <ul>
          <li><a href="/" data-testid="error-home-link">Retour à l'accueil</a></li>
          <li><a href="/catalogue">Parcourir le catalogue</a></li>
          <li><a href="/plan-du-site">Consulter le plan du site</a></li>
        </ul>
      </div>
    </main>
    <!--# include virtual="/partials/footer.html" -->
  </body>
</html>
